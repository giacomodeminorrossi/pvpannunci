name: Controllo giornaliero PVP

on:
  schedule:
    - cron: "7 21 * * *"
    - cron: "7 22 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Data da controllare (YYYY-MM-DD); vuoto = oggi in Europe/Paris"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: pvp-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Paris

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Verifica orario locale e data target
        id: schedule_guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
        run: |
          local_hour="$(TZ=Europe/Paris date +%H)"
          local_timestamp="$(TZ=Europe/Paris date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Ora locale Europe/Paris: $local_timestamp"
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            if [[ "$local_hour" == "23" ]]; then
              target_date="$(TZ=Europe/Paris date +%F)"
            elif (( 10#$local_hour < 7 )); then
              target_date="$(TZ=Europe/Paris date -d yesterday +%F)"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Trigger programmato ignorato: ora locale $local_hour, fuori dalla finestra 23:00-06:59."
              exit 0
            fi
          else
            target_date="${MANUAL_TARGET_DATE:-$(TZ=Europe/Paris date +%F)}"
          fi
          # Con l'ora legale entrambi i cron cadono nella finestra e controllano la
          # stessa data: il secondo viene saltato se il primo è già riuscito.
          history_file="data/history/$target_date.json"
          if [[ "$EVENT_NAME" == "schedule" && -f "$history_file" ]] \
            && [[ "$(jq -r '.status' "$history_file")" == "success" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Data $target_date già controllata con successo: esecuzione saltata."
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          echo "Data target: $target_date"

      - name: Configura Node.js
        if: steps.schedule_guard.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa le dipendenze
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: npm install --no-audit --no-fund

      - name: Installa Chromium
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Controlla gli annunci PVP
        if: steps.schedule_guard.outputs.should_run == 'true'
        id: scrape
        continue-on-error: true
        env:
          TARGET_DATE: ${{ steps.schedule_guard.outputs.target_date }}
        run: npm run scrape

      - name: Carica la diagnostica dei dettagli non verificati
        if: always() && steps.schedule_guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pvp-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepara la notifica dei nuovi annunci
        if: always() && steps.schedule_guard.outputs.should_run == 'true'
        id: notify
        run: node scripts/notify-new.mjs prepare "$RUNNER_TEMP/notify.md"

      - name: Apri una issue per i nuovi annunci
        if: always() && steps.notify.outputs.new_count > 0
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ steps.notify.outputs.title }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/notify.md"
          node scripts/notify-new.mjs mark

      - name: Salva il risultato
        if: always() && steps.schedule_guard.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati."
            exit 0
          fi

          git commit -m "Update daily PVP results"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push non riuscito (tentativo $attempt), nuovo tentativo..."
            sleep $((attempt * 5))
          done
          echo "Impossibile pubblicare i risultati dopo 4 tentativi."
          exit 1

      - name: Segnala un controllo non completato
        if: steps.schedule_guard.outputs.should_run == 'true' && steps.scrape.outcome == 'failure'
        run: |
          echo "Lo scraper non ha completato il controllo. Consultare data/latest.json."
          exit 1
